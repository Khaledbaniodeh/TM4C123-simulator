name: Performance probe

# Measures wall-clock cost of firmware workloads in Renode (COUNTFLAG polling
# vs. interrupts, MMIO polling of different peripherals). Measurement only;
# results appear as annotations and in the job summary.

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/perf/**"
      - ".github/workflows/perf-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache pinned toolchains
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('tools.lock.json') }}
      - run: npm run setup:tools
      - run: npm ci
      - name: COUNTFLAG performance probe
        run: node tools/perf/countflag-bench.mjs
