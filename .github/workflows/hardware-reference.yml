name: Hardware reference

# Extracts EK-TM4C123GXL facts from TI's official documents on the runner:
#   - SPMR240 (Rev A EAGLE design files): board outline, part placement, pad coordinates
#   - SPMU296 (User's Guide): BoosterPack header tables, checked against our pin map
# TI files are downloaded only on the runner and never committed.

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/hwref/**"
      - "apps/web/board/ek-tm4c123gxl.pins.json"
      - ".github/workflows/hardware-reference.yml"

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pdftotext
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils

      - name: Download TI documents (runner only)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ti"
          ua="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -fsSL -A "$ua" -o "$RUNNER_TEMP/ti/spmu296.pdf" https://www.ti.com/lit/ug/spmu296/spmu296.pdf
          curl -fsSL -A "$ua" -o "$RUNNER_TEMP/ti/spmr240.zip" https://www.ti.com/lit/zip/spmr240
          ls -la "$RUNNER_TEMP/ti"
          sha256sum "$RUNNER_TEMP/ti"/*
          file "$RUNNER_TEMP/ti"/*

      - name: Board geometry summary
        run: python3 tools/hwref/extract_brd.py "$RUNNER_TEMP/ti/spmr240.zip" summary

      - name: Connector, switch, and LED pads
        if: always()
        run: python3 tools/hwref/extract_brd.py "$RUNNER_TEMP/ti/spmr240.zip" headers

      - name: Verify pin map against SPMU296
        if: always()
        run: |
          pdftotext -layout "$RUNNER_TEMP/ti/spmu296.pdf" "$RUNNER_TEMP/ti/spmu296.txt"
          python3 tools/hwref/check_pinmap.py "$RUNNER_TEMP/ti/spmu296.txt" apps/web/board/ek-tm4c123gxl.pins.json
